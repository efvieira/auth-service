spring:
  application:
    name: auth-service

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    filter: true

# DynamoDB (padrão: LocalStack). Em produção, sobrescreva via variáveis de ambiente.
aws:
  dynamodb:
    endpoint: ${AWS_DYNAMODB_ENDPOINT:http://localhost:4566}
    region: ${AWS_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}
    # Cria as tabelas automaticamente na inicialização, caso não existam
    criar-tabelas: ${AWS_DYNAMODB_CRIAR_TABELAS:true}

dynamodb:
  tables:
    perfis: perfis
    usuarios: usuarios
    refresh-tokens: refresh_tokens
    auditoria-autenticacao: auditoria_autenticacao

jwt:
  # HS256 exige no mínimo 32 bytes. Em produção defina JWT_SECRET.
  secret: ${JWT_SECRET:dev-only-chave-secreta-troque-em-producao-com-32+bytes}
  expiration: ${JWT_EXPIRATION:3600000}                  # 1 hora em ms
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 dias em ms

# Usuário ADMIN inicial, criado na inicialização se ainda não existir.
# Deixe ADMIN_EMAIL vazio para desativar.
bootstrap:
  admin:
    email: ${ADMIN_EMAIL:admin@example.com}
    senha: ${ADMIN_SENHA:AdminSenha123}
    nome: ${ADMIN_NOME:Administrador}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

logging:
  level:
    root: INFO
    com.authservice: DEBUG
